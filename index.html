            background: white; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.05);

            merged[key] = { name: h.name, nameEn: h.nameEn, city: h.city, cityEn: h.cityEn, classes: [] };
        }
        if (!merged[key].classes.includes(h.class)) {
            merged[key].classes.push(h.class);
        }
    });

    // Sort classes: VIP, A, B+, B, C, C1, C-R
    const classOrder = ["VIP", "A", "B+", "B", "C", "C1", "C-R"];
    const hospitals = Object.values(merged).map(h => ({
        ...h,
        classes: h.classes.sort((a, b) => classOrder.indexOf(a) - classOrder.indexOf(b))
    }));

    let currentLang = 'ar';

    function getHighestClass(classes) {
        for (const c of classOrder) {
            if (classes.includes(c)) return c;
        }
        return classes[0];
    }

    function getCardClass(classes) {
        const c = getHighestClass(classes);
        const map = { 'VIP': 'card-vip', 'A': 'card-a', 'B+': 'card-bplus', 'B': 'card-b', 'C': 'card-c', 'C1': 'card-c1', 'C-R': 'card-cr' };
        return map[c] || '';
    }

    function getTagClass(c) {
        const map = { 'VIP': 'tag-vip', 'A': 'tag-a', 'B+': 'tag-bplus', 'B': 'tag-b', 'C': 'tag-c', 'C1': 'tag-c1', 'C-R': 'tag-cr' };
        return map[c] || '';
    }

    function createCard(h) {
        const div = document.createElement('div');
        div.className = `card ${getCardClass(h.classes)}`;
        div.setAttribute('data-classes', h.classes.join(','));
        div.setAttribute('data-city', h.city);
        const displayName = currentLang === 'ar' ? h.name : h.nameEn;
        const displayCity = currentLang === 'ar' ? h.city : h.cityEn;
        const encoded = encodeURIComponent(`${displayName} ${displayCity}`);
        const mapText = currentLang === 'ar' ? 'فتح في قوقل ماب' : 'Open in Google Maps';
        const classesLabel = currentLang === 'ar' ? 'الفئات' : 'Classes';
        const tagsHTML = h.classes.map(c => `<span class="class-tag ${getTagClass(c)}">${c}</span>`).join(' ');
        div.innerHTML = `
            <div class="card-body">
                <h3 class="card-title">🏥 ${displayName}</h3>
                <div class="card-city"><i class="fas fa-map-marker-alt"></i> ${displayCity}</div>
                <div style="font-size:0.75em;color:#64748b;margin-bottom:4px;">${classesLabel}:</div>
                <div class="classes-row">${tagsHTML}</div>
            </div>
            <div class="card-footer">
                <a href="https://www.google.com/maps/search/${encoded}" target="_blank" class="map-btn">
                    <i class="fas fa-map-marked-alt"></i> ${mapText}
                </a>
            </div>
        `;
        return div;
    }

    function switchLanguage(lang) {
        currentLang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => {
            b.classList.toggle('active', b.getAttribute('data-lang') === lang);
        });
        document.querySelector('.header h1').textContent = document.querySelector('.header h1').getAttribute(`data-${lang}`);
        document.querySelector('.header .sub').textContent = document.querySelector('.header .sub').getAttribute(`data-${lang}`);
        const si = document.getElementById('searchInput');
        si.placeholder = si.getAttribute(`data-${lang}-placeholder`);
        document.querySelectorAll('.filter-label').forEach(el => el.textContent = el.getAttribute(`data-${lang}`));
        document.querySelectorAll('.btn[data-ar]').forEach(el => el.textContent = el.getAttribute(`data-${lang}`));
        document.querySelector('.footer').textContent = document.querySelector('.footer').getAttribute(`data-${lang}`);
        render();
    }

    function render() {
        const grid = document.getElementById('cardsGrid');
        grid.innerHTML = '';
        const q = document.getElementById('searchInput').value.toLowerCase();
        const cf = document.querySelector('#classFilters .btn.active')?.getAttribute('data-filter') || 'all';
        const ctf = document.querySelector('#cityFilters .btn.active')?.getAttribute('data-city') || 'all';

        let f = hospitals.filter(h => {
            if (cf !== 'all' && !h.classes.includes(cf)) return false;
            const cityMatch = currentLang === 'ar' ? h.city : h.cityEn;
            if (ctf !== 'all' && cityMatch !== ctf) return false;
            if (q) {
                const dn = currentLang === 'ar' ? h.name : h.nameEn;
                const dc = currentLang === 'ar' ? h.city : h.cityEn;
                if (!`${dn} ${dc} ${h.nameEn} ${h.cityEn} ${h.classes.join(' ')}`.toLowerCase().includes(q)) return false;
            }
            return true;
        });

        if (f.length === 0) {
            grid.innerHTML = `<div class="no-res">${currentLang === 'ar' ? '🔍 لا توجد نتائج مطابقة' : '🔍 No results found'}</div>`;
        } else {
            f.forEach(h => grid.appendChild(createCard(h)));
        }
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', function() { switchLanguage(this.getAttribute('data-lang')); });
    });
    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('classFilters').addEventListener('click', e => {
        if (e.target.classList.contains('btn')) {
            document.querySelectorAll('#classFilters .btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            render();
        }
    });
    document.getElementById('cityFilters').addEventListener('click', e => {
        if (e.target.classList.contains('btn')) {
            document.querySelectorAll('#cityFilters .btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            render();
        }
    });

    render();
</script>
</body>
</html>
