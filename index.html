    // ==================== FUNCTIONS ====================
    function createCard(h) {
        const div = document.createElement('div');
        div.className = `hospital-card card-${h.class}`;
        div.setAttribute('data-class', h.class);
        div.setAttribute('data-city', h.city);
        const encoded = encodeURIComponent(`${h.name} ${h.city}`);
        div.innerHTML = `
            <h3 class="hospital-name">🏥 ${h.name}</h3>
            <div class="hospital-meta">
                <span class="class-badge badge-${h.class}">${h.class}</span>
                <span class="city-tag">📍 ${h.city}</span>
            </div>
            <a href="https://www.google.com/maps/search/${encoded}" target="_blank" class="map-link">
                🗺️ فتح الموقع في قوقل ماب
            </a>
        `;
        return div;
    }

    function renderCards() {
        const grid = document.getElementById('cardsGrid');
        grid.innerHTML = '';
        const searchQuery = document.getElementById('searchInput').value.toLowerCase();
        const activeClassBtn = document.querySelector('#classFilters .filter-btn.active');
        const activeCityBtn = document.querySelector('#cityFilters .filter-btn.active');
        const classFilter = activeClassBtn ? activeClassBtn.getAttribute('data-filter') : 'all';
        const cityFilter = activeCityBtn ? activeCityBtn.getAttribute('data-city') : 'all';

        let filtered = hospitals.filter(h => {
            if (classFilter !== 'all' && h.class !== classFilter) return false;
            if (cityFilter !== 'all' && h.city !== cityFilter) return false;
            if (searchQuery) {
                const txt = `${h.name} ${h.city} ${h.class}`.toLowerCase();
                if (!txt.includes(searchQuery)) return false;
            }
            return true;
        });

        // Stats
        document.getElementById('totalCount').textContent = filtered.length;
        document.getElementById('vipCount').textContent = filtered.filter(h => h.class === 'VIP').length;
        document.getElementById('aCount').textContent = filtered.filter(h => h.class === 'A').length;
        document.getElementById('bCount').textContent = filtered.filter(h => h.class === 'B').length;
        document.getElementById('bplusCount').textContent = filtered.filter(h => h.class === 'B+').length;
        document.getElementById('cCount').textContent = filtered.filter(h => h.class === 'C').length;
        document.getElementById('c1Count').textContent = filtered.filter(h => h.class === 'C1').length;
        document.getElementById('crCount').textContent = filtered.filter(h => h.class === 'C-R').length;

        if (filtered.length === 0) {
            grid.innerHTML = '<div class="no-results">🔍 لا توجد نتائج مطابقة</div>';
        } else {
            filtered.forEach(h => grid.appendChild(createCard(h)));
        }
    }

    // Event Listeners
    document.getElementById('searchInput').addEventListener('input', renderCards);

    document.getElementById('classFilters').addEventListener('click', function(e) {
        if (e.target.classList.contains('filter-btn')) {
            this.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            renderCards();
        }
    });

    document.getElementById('cityFilters').addEventListener('click', function(e) {
        if (e.target.classList.contains('filter-btn')) {
            this.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            renderCards();
        }
    });

    // Initial
    renderCards();
</script>
