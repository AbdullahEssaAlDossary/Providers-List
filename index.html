<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل المستشفيات والمراكز الطبية</title>
    <!-- Tailwind CSS لضمان تصميم أنيق ومتجاوب -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- الهيدر -->
    <header class="bg-blue-600 text-white shadow-lg py-6 px-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold">دليل الشبكة الطبية للتأمين</h1>
                <p class="text-sm text-blue-100 mt-1">ابحث عن المستشفيات والمجمعات الطبية المعتمدة ومستويات الكلاس</p>
            </div>
            <div id="stats" class="bg-blue-700 px-4 py-2 rounded-lg text-sm font-semibold">
                جاري تحميل البيانات...
            </div>
        </div>
    </header>

    <!-- أدوات البحث والفلترة -->
    <main class="max-w-6xl mx-auto w-full p-4 flex-grow">
        <div class="bg-white rounded-xl shadow-sm p-4 md:p-6 mb-6 grid grid-cols-1 md:grid-cols-4 gap-4">
            
            <!-- خانة البحث -->
            <div class="md:col-span-2">
                <label class="block text-sm font-semibold text-gray-600 mb-1">ابحث باسم المستشفى أو المركز:</label>
                <input type="text" id="searchInput" placeholder="اكتب اسم المستشفى، نوع المنشأة..." 
                       class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none text-base">
            </div>

            <!-- فلتر المدينة -->
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">المدينة:</label>
                <select id="cityFilter" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">الكل</option>
                </select>
            </div>

            <!-- فلتر الكلاس -->
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">فئة التأمين (Class):</label>
                <select id="classFilter" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">الكل</option>
                </select>
            </div>

        </div>

        <!-- جدول وعرض البيانات -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-gray-100 border-b border-gray-200 text-gray-600 font-bold text-sm">
                            <th class="p-4">المنشأة الطبية</th>
                            <th class="p-4">النوع</th>
                            <th class="p-4">المدينة</th>
                            <th class="p-4 text-center">الفئة (Class)</th>
                        </tr>
                    </thead>
                    <tbody id="providersTable" class="divide-y divide-gray-100 text-sm">
                        <tr>
                            <td colspan="4" class="p-8 text-center text-gray-500">جاري تحميل المنشآت الطبية...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- أزرار التصفح (Pagination) لضمان سرعة الصفحة -->
            <div class="p-4 bg-gray-50 border-t border-gray-200 flex justify-between items-center text-sm">
                <button id="prevBtn" class="bg-white border border-gray-300 px-4 py-2 rounded-lg hover:bg-gray-100 font-medium disabled:opacity-50" disabled>السابق</button>
                <span id="pageInfo" class="text-gray-600">صفحة 1 من 1</span>
                <button id="nextBtn" class="bg-white border border-gray-300 px-4 py-2 rounded-lg hover:bg-gray-100 font-medium disabled:opacity-50" disabled>التالي</button>
            </div>
        </div>
    </main>

    <!-- الفوتر -->
    <footer class="bg-gray-800 text-gray-400 text-center py-4 text-xs mt-8">
        جميع الحقوق محفوظة © دليلك الطبي المطور
    </footer>

    <!-- استدعاء ملف البيانات والمنطق البرمجي -->
    <script src="data.js"></script>
    <script>
        let currentPage = 1;
        const rowsPerPage = 20;
        let filteredData = [];

        // تشغيل الصفحة عند اكتمال تحميل البيانات
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof medicalData === 'undefined') {
                document.getElementById('providersTable').innerHTML = `<tr><td colspan="4" class="p-8 text-center text-red-500">خطأ: لم يتم العثور على ملف data.js أو أنه فارغ.</td></tr>`;
                return;
            }
            
            filteredData = [...medicalData];
            initFilters();
            renderTable();

            // الاستماع لمدخلات البحث والفلاتر
            document.getElementById('searchInput').addEventListener('input', filterData);
            document.getElementById('cityFilter').addEventListener('change', filterData);
            document.getElementById('classFilter').addEventListener('change', filterData);
            
            document.getElementById('prevBtn').addEventListener('click', () => { if(currentPage > 1) { currentPage--; renderTable(); } });
            document.getElementById('nextBtn').addEventListener('click', () => { if(currentPage < Math.ceil(filteredData.length / rowsPerPage)) { currentPage++; renderTable(); } });
        });

        // تعبئة خيارات الفلاتر تلقائياً
        function initFilters() {
            const cities = [...new Set(medicalData.map(item => item.c))].sort();
            const classes = [...new Set(medicalData.map(item => item.cl))].sort();

            const citySelect = document.getElementById('cityFilter');
            cities.forEach(city => {
                if(city) citySelect.options.add(new Option(city, city));
            });

            const classSelect = document.getElementById('classFilter');
            classes.forEach(cls => {
                if(cls) classSelect.options.add(new Option(cls, cls));
            });
        }

        // فلترة البيانات بناءً على مدخلات المستخدم
        function filterData() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            const cityVal = document.getElementById('cityFilter').value;
            const classVal = document.getElementById('classFilter').value;

            filteredData = medicalData.filter(item => {
                const matchesSearch = !searchVal || 
                                      item.p.toLowerCase().includes(searchVal) || 
                                      item.t.toLowerCase().includes(searchVal);
                const matchesCity = !cityVal || item.c === cityVal;
                const matchesClass = !classVal || item.cl === classVal;
                
                return matchesSearch && matchesCity && matchesClass;
            });

            currentPage = 1;
            renderTable();
        }

        // عرض الجدول بشكل منظم ومقسم لصفحات لتسريع المتصفح
        function renderTable() {
            const tbody = document.getElementById('providersTable');
            const totalItems = filteredData.length;
            
            document.getElementById('stats').innerText = `إجمالي المنشآت: ${totalItems.toLocaleString()}`;

            if (totalItems === 0) {
                tbody.html = `<tr><td colspan="4" class="p-8 text-center text-gray-500">لا توجد نتائج مطابقة لبحثك.</td></tr>`;
                document.getElementById('pageInfo').innerText = "صفحة 0 من 0";
                document.getElementById('prevBtn').disabled = true;
                document.getElementById('nextBtn').disabled = true;
                return;
            }

            const totalPages = Math.ceil(totalItems / rowsPerPage);
            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const pageItems = filteredData.slice(start, end);

            let html = '';
            pageItems.forEach(item => {
                // تلوين الكلاسات لمنظر جمالي وأوضح
                let classBadge = 'bg-gray-100 text-gray-800';
                if(item.cl === 'VIP') classBadge = 'bg-amber-100 text-amber-800 font-bold border border-amber-300';
                else if(['A', 'A+'].includes(item.cl)) classBadge = 'bg-green-100 text-green-800 font-semibold';
                else if(item.cl.startsWith('B')) classBadge = 'bg-blue-100 text-blue-800';
                else if(item.cl.startsWith('C')) classBadge = 'bg-orange-100 text-orange-800';

                html += `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="p-4 font-medium text-gray-900 max-w-xs md:max-w-md">${item.p}</td>
                        <td class="p-4 text-gray-500">${item.t}</td>
                        <td class="p-4 text-gray-600">${item.c}</td>
                        <td class="p-4 text-center">
                            <span class="px-3 py-1 rounded-full text-xs ${classBadge}">${item.cl}</span>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
            document.getElementById('pageInfo').innerText = `صفحة ${currentPage} من ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
        }
    </script>
</body>
</html>
