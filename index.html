<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <style>
        :root {
            --vip: #7c3aed;
            --class-a: #ea580c;
            --class-b: #2563eb;
            --class-bplus: #0891b2;
            --class-c: #64748b;
            --class-c1: #475569;
            --class-cr: #78716c;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text2: #64748b;
            --radius: 20px;
            --shadow: 0 4px 24px rgba(0,0,0,0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: #f1f5f9;
            background-image: 
                radial-gradient(ellipse at 20% 20%, rgba(37,99,235,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(124,58,237,0.04) 0%, transparent 50%);
            min-height: 100vh;
            padding: 16px;
            color: var(--text);
        }

        .container { max-width: 1400px; margin: 0 auto; }

        /* Hero */
        .hero {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #6366f1 100%);
            border-radius: 24px;
            padding: 28px 24px 24px;
            margin-bottom: 20px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(30,58,138,0.25);
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -60px; right: -60px;
            width: 200px; height: 200px;
            background: rgba(255,255,255,0.04);
            border-radius: 50%;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: -40px; left: -40px;
            width: 160px; height: 160px;
            background: rgba(255,255,255,0.04);
            border-radius: 50%;
        }
        .hero-logo {
            width: 64px; height: 64px;
            background: white; border-radius: 16px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: 900; color: #1e3a8a;
            margin-bottom: 12px; position: relative; z-index: 1;
        }
        .hero h1 { font-size: 1.8em; font-weight: 800; position: relative; z-index: 1; }
        .hero p { opacity: 0.9; font-size: 1em; margin-top: 4px; position: relative; z-index: 1; }

        /* Stats Row */
        .stats {
            display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
            margin-bottom: 20px;
        }
        .stat {
            background: white; padding: 12px 16px; border-radius: 14px;
            text-align: center; box-shadow: var(--shadow);
            min-width: 70px; transition: transform 0.2s;
            border-bottom: 3px solid transparent;
        }
        .stat:hover { transform: translateY(-2px); }
        .stat .num { font-size: 1.5em; font-weight: 800; display: block; }
        .stat .lbl { font-size: 0.7em; color: var(--text2); }
        .st-vip { border-bottom-color: var(--vip); } .st-vip .num { color: var(--vip); }
        .st-a { border-bottom-color: var(--class-a); } .st-a .num { color: var(--class-a); }
        .st-b { border-bottom-color: var(--class-b); } .st-b .num { color: var(--class-b); }
        .st-bplus { border-bottom-color: var(--class-bplus); } .st-bplus .num { color: var(--class-bplus); }
        .st-c { border-bottom-color: var(--class-c); } .st-c .num { color: var(--class-c); }
        .st-c1 { border-bottom-color: var(--class-c1); } .st-c1 .num { color: var(--class-c1); }
        .st-cr { border-bottom-color: var(--class-cr); } .st-cr .num { color: var(--class-cr); }
        .st-total { border-bottom-color: #1e3a8a; } .st-total .num { color: #1e3a8a; }

        /* Controls */
        .controls {
            background: white; border-radius: var(--radius); padding: 16px 20px;
            margin-bottom: 20px; box-shadow: var(--shadow); display: flex;
            flex-wrap: wrap; gap: 12px; align-items: center;
        }
        .search-wrap {
            flex: 1; min-width: 220px; position: relative;
        }
        .search-wrap input {
            width: 100%; padding: 12px 44px 12px 16px; border: 2px solid #e2e8f0;
            border-radius: 50px; font-family: 'Cairo', sans-serif; font-size: 14px;
            outline: none; transition: all 0.3s; background: #f8fafc;
        }
        .search-wrap input:focus { border-color: #3b82f6; background: white; box-shadow: 0 0 0 4px rgba(59,130,246,0.1); }
        .search-wrap .sicon { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn {
            padding: 8px 14px; border: 2px solid #e2e8f0; background: #f8fafc;
            border-radius: 50px; cursor: pointer; font-family: 'Cairo', sans-serif;
            font-size: 12px; font-weight: 600; transition: all 0.25s; white-space: nowrap;
            color: var(--text2);
        }
        .btn:hover { border-color: #3b82f6; color: #3b82f6; background: #eff6ff; }
        .btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .divider { width: 1px; height: 24px; background: #e2e8f0; margin: 0 6px; }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 14px;
        }

        /* Card */
        .card {
            background: white; border-radius: 16px; overflow: hidden;
            box-shadow: var(--shadow); transition: all 0.3s;
            display: flex; flex-direction: column;
            border: 1px solid #f1f5f9;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 16px 32px rgba(0,0,0,0.1); }

        .card-img {
            height: 100px; display: flex; align-items: center; justify-content: center;
            font-size: 3em; position: relative;
        }
        .img-vip { background: linear-gradient(135deg, #ede9fe, #c4b5fd); }
        .img-a { background: linear-gradient(135deg, #fff7ed, #fed7aa); }
        .img-b { background: linear-gradient(135deg, #eff6ff, #bfdbfe); }
        .img-bplus { background: linear-gradient(135deg, #ecfeff, #a5f3fc); }
        .img-c { background: linear-gradient(135deg, #f8fafc, #e2e8f0); }
        .img-c1 { background: linear-gradient(135deg, #f8fafc, #cbd5e1); }
        .img-cr { background: linear-gradient(135deg, #fafaf9, #d6d3d1); }

        .card-class {
            position: absolute; top: 10px; left: 10px;
            padding: 4px 10px; border-radius: 10px; font-size: 0.7em;
            font-weight: 700; color: white;
        }
        .cl-vip { background: var(--vip); }
        .cl-a { background: var(--class-a); }
        .cl-b { background: var(--class-b); }
        .cl-bplus { background: var(--class-bplus); }
        .cl-c { background: var(--class-c); }
        .cl-c1 { background: var(--class-c1); }
        .cl-cr { background: var(--class-cr); }

        .card-body { padding: 14px 16px; flex: 1; }
        .card-title {
            font-size: 0.95em; font-weight: 700; color: var(--text);
            line-height: 1.5; margin-bottom: 6px; display: -webkit-box;
            -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .card-city {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 0.78em; color: var(--text2); margin-bottom: 4px;
        }
        .card-footer {
            padding: 10px 16px; border-top: 1px solid #f1f5f9;
            display: flex; gap: 8px;
        }
        .map-btn {
            flex: 1; display: flex; align-items: center; justify-content: center;
            gap: 6px; padding: 10px; border-radius: 12px;
            text-decoration: none; font-size: 0.82em; font-weight: 700;
            transition: all 0.2s; background: #f0fdf4; color: #166534;
            border: 1px solid #bbf7d0;
        }
        .map-btn:hover { background: #dcfce7; border-color: #86efac; }

        .no-res {
            text-align: center; padding: 60px 20px; color: var(--text2);
            font-size: 1.1em; grid-column: 1 / -1; background: white;
            border-radius: var(--radius); box-shadow: var(--shadow);
        }
        .no-res .icon { font-size: 4em; display: block; margin-bottom: 12px; }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            .hero h1 { font-size: 1.4em; }
            .btn { padding: 6px 10px; font-size: 11px; }
            .divider { display: none; }
        }
    </style>
</head>

    function getImgClass(c) {
        const map = { 'VIP': 'img-vip', 'A': 'img-a', 'B': 'img-b', 'B+': 'img-bplus', 'C': 'img-c', 'C1': 'img-c1', 'C-R': 'img-cr' };
        return map[c] || 'img-c';
    }
    function getClClass(c) {
        const map = { 'VIP': 'cl-vip', 'A': 'cl-a', 'B': 'cl-b', 'B+': 'cl-bplus', 'C': 'cl-c', 'C1': 'cl-c1', 'C-R': 'cl-cr' };
        return map[c] || 'cl-c';
    }
    function getIcon(c) {
        const map = { 'VIP': '💎', 'A': '⭐', 'B': '🏥', 'B+': '🏨', 'C': '🩺', 'C1': '💊', 'C-R': '🩹' };
        return map[c] || '🏥';
    }

    function createCard(h) {
        const div = document.createElement('div');
        div.className = 'card';
        div.setAttribute('data-class', h.class);
        div.setAttribute('data-city', h.city);
        const encoded = encodeURIComponent(`${h.name} ${h.city}`);
        div.innerHTML = `
            <div class="card-img ${getImgClass(h.class)}">
                <span class="card-class ${getClClass(h.class)}">${h.class}</span>
                ${getIcon(h.class)}
            </div>
            <div class="card-body">
                <h3 class="card-title">${h.name}</h3>
                <div class="card-city"><i class="fas fa-map-marker-alt"></i> ${h.city}</div>
            </div>
            <div class="card-footer">
                <a href="https://www.google.com/maps/search/${encoded}" target="_blank" class="map-btn">
                    <i class="fas fa-map-marked-alt"></i> فتح في قوقل ماب
                </a>
            </div>
        `;
        return div;
    }

        grid.innerHTML = '';
        const q = document.getElementById('searchInput').value.toLowerCase();
        const cf = document.querySelector('#classFilters .btn.active')?.getAttribute('data-filter') || 'all';
        const ctf = document.querySelector('#cityFilters .btn.active')?.getAttribute('data-city') || 'all';

        let f = hospitals.filter(h => {
            if (cf !== 'all' && h.class !== cf) return false;
            if (ctf !== 'all' && h.city !== ctf) return false;
            if (q && !`${h.name} ${h.city}`.toLowerCase().includes(q)) return false;
            return true;
        });

        document.getElementById('totalCount').textContent = f.length;
        document.getElementById('vipCount').textContent = f.filter(h => h.class === 'VIP').length;
        document.getElementById('aCount').textContent = f.filter(h => h.class === 'A').length;
        document.getElementById('bCount').textContent = f.filter(h => h.class === 'B').length;
        document.getElementById('bplusCount').textContent = f.filter(h => h.class === 'B+').length;
        document.getElementById('cCount').textContent = f.filter(h => h.class === 'C').length;
        document.getElementById('c1Count').textContent = f.filter(h => h.class === 'C1').length;
        document.getElementById('crCount').textContent = f.filter(h => h.class === 'C-R').length;

        if (f.length === 0) {
            grid.innerHTML = `<div class="no-res"><span class="icon">🔍</span>لا توجد نتائج مطابقة</div>`;
        } else {
            f.forEach(h => grid.appendChild(createCard(h)));
        }
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('classFilters').addEventListener('click', e => {
        if (e.target.classList.contains('btn')) {
            document.querySelectorAll('#classFilters .btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            render();
        }
    });
    document.getElementById('cityFilters').addEventListener('click', e => {
        if (e.target.classList.contains('btn')) {
            document.querySelectorAll('#cityFilters .btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            render();
        }
    });

    render();
</script>
</body>
</html>
