<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل مستشفيات التعاونية - Tawuniya Medical Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --vip: #7c3aed;
            --class-a: #ea580c;
            --class-b: #2563eb;
            --class-bplus: #0891b2;
            --class-c: #64748b;
            --class-c1: #475569;
            --class-cr: #78716c;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text2: #64748b;
            --radius: 16px;
            --shadow: 0 2px 12px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
        }

        .container { max-width: 1400px; margin: 0 auto; }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 20px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 24px rgba(30,58,138,0.2);
        }
        .header h1 { font-size: 1.6em; font-weight: 800; }
        .header p { opacity: 0.85; font-size: 0.9em; margin-top: 4px; }

        /* Stats */
        .stats {
            display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
            margin-bottom: 20px;
        }
        .stat {
            background: white; padding: 10px 14px; border-radius: 12px;
            text-align: center; box-shadow: var(--shadow);
            min-width: 60px; transition: transform 0.2s;
            border-bottom: 3px solid transparent;
        }
        .stat:hover { transform: translateY(-2px); }
        .stat .num { font-size: 1.4em; font-weight: 800; display: block; }
        .stat .lbl { font-size: 0.65em; color: var(--text2); }
        .st-vip { border-bottom-color: var(--vip); } .st-vip .num { color: var(--vip); }
        .st-a { border-bottom-color: var(--class-a); } .st-a .num { color: var(--class-a); }
        .st-b { border-bottom-color: var(--class-b); } .st-b .num { color: var(--class-b); }
        .st-bplus { border-bottom-color: var(--class-bplus); } .st-bplus .num { color: var(--class-bplus); }
        .st-c { border-bottom-color: var(--class-c); } .st-c .num { color: var(--class-c); }
        .st-c1 { border-bottom-color: var(--class-c1); } .st-c1 .num { color: var(--class-c1); }
        .st-cr { border-bottom-color: var(--class-cr); } .st-cr .num { color: var(--class-cr); }
        .st-total { border-bottom-color: #1e3a8a; } .st-total .num { color: #1e3a8a; }

        /* Controls */
        .controls {
            background: white; border-radius: var(--radius); padding: 14px 18px;
            margin-bottom: 20px; box-shadow: var(--shadow); display: flex;
            flex-wrap: wrap; gap: 10px; align-items: center;
        }
        .search-wrap {
            flex: 1; min-width: 200px; position: relative;
        }
        .search-wrap input {
            width: 100%; padding: 10px 40px 10px 14px; border: 2px solid #e2e8f0;
            border-radius: 50px; font-family: 'Cairo', sans-serif; font-size: 14px;
            outline: none; transition: all 0.3s; background: #f8fafc;
        }
        .search-wrap input:focus { border-color: #2563eb; background: white; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .search-wrap .sicon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .btn-group { display: flex; gap: 5px; flex-wrap: wrap; }
        .btn {
            padding: 7px 12px; border: 2px solid #e2e8f0; background: #f8fafc;
            border-radius: 50px; cursor: pointer; font-family: 'Cairo', sans-serif;
            font-size: 11px; font-weight: 600; transition: all 0.25s; white-space: nowrap;
            color: var(--text2);
        }
        .btn:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }
        .btn.active { background: #2563eb; color: white; border-color: #2563eb; }
        .divider { width: 1px; height: 20px; background: #e2e8f0; margin: 0 4px; }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 12px;
        }

        /* Card */
        .card {
            background: white; border-radius: 14px;
            box-shadow: var(--shadow); transition: all 0.25s;
            display: flex; flex-direction: column;
            border: 1px solid #f1f5f9;
            border-right: 5px solid #e2e8f0;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,0.08); }

        .card-vip { border-right-color: var(--vip); }
        .card-a { border-right-color: var(--class-a); }
        .card-b { border-right-color: var(--class-b); }
        .card-bplus { border-right-color: var(--class-bplus); }
        .card-c { border-right-color: var(--class-c); }
        .card-c1 { border-right-color: var(--class-c1); }
        .card-cr { border-right-color: var(--class-cr); }

        .card-body { padding: 16px 18px; flex: 1; }
        .card-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 8px; gap: 8px;
        }
        .card-title {
            font-size: 0.95em; font-weight: 700; color: var(--text);
            line-height: 1.5; flex: 1;
        }
        .class-badge {
            padding: 3px 10px; border-radius: 10px; font-size: 0.7em;
            font-weight: 700; color: white; white-space: nowrap;
        }
        .bd-vip { background: var(--vip); }
        .bd-a { background: var(--class-a); }
        .bd-b { background: var(--class-b); }
        .bd-bplus { background: var(--class-bplus); }
        .bd-c { background: var(--class-c); }
        .bd-c1 { background: var(--class-c1); }
        .bd-cr { background: var(--class-cr); }

        .card-city {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 0.78em; color: var(--text2); margin-bottom: 4px;
            background: #f8fafc; padding: 4px 10px; border-radius: 8px;
        }
        .card-footer {
            padding: 10px 18px; border-top: 1px solid #f1f5f9;
            display: flex; gap: 8px;
        }
        .map-btn {
            flex: 1; display: flex; align-items: center; justify-content: center;
            gap: 6px; padding: 10px; border-radius: 10px;
            text-decoration: none; font-size: 0.8em; font-weight: 700;
            transition: all 0.2s; background: #f8fafc; color: #2563eb;
            border: 1px solid #e2e8f0;
        }
        .map-btn:hover { background: #eff6ff; border-color: #bfdbfe; }

        .no-res {
            text-align: center; padding: 50px 20px; color: var(--text2);
            font-size: 1.1em; grid-column: 1 / -1; background: white;
            border-radius: var(--radius); box-shadow: var(--shadow);
        }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.3em; }
            .btn { padding: 6px 10px; font-size: 10px; }
            .divider { display: none; }
            body { padding: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <h1>🏥 دليل شبكة مزودي التعاونية الطبي</h1>
        <p>Tawuniya Insurance - Medical Network Guide</p>
    </div>

    <!-- Stats -->
    <div class="stats">
        <div class="stat st-total"><span class="num" id="totalCount">0</span><span class="lbl">الكل</span></div>
        <div class="stat st-vip"><span class="num" id="vipCount">0</span><span class="lbl">VIP</span></div>
        <div class="stat st-a"><span class="num" id="aCount">0</span><span class="lbl">A</span></div>
        <div class="stat st-b"><span class="num" id="bCount">0</span><span class="lbl">B</span></div>
        <div class="stat st-bplus"><span class="num" id="bplusCount">0</span><span class="lbl">B+</span></div>
        <div class="stat st-c"><span class="num" id="cCount">0</span><span class="lbl">C</span></div>
        <div class="stat st-c1"><span class="num" id="c1Count">0</span><span class="lbl">C1</span></div>
        <div class="stat st-cr"><span class="num" id="crCount">0</span><span class="lbl">C-R</span></div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="🔍 ابحث عن مستشفى أو مدينة...">
            <span class="sicon"><i class="fas fa-search"></i></span>
        </div>
        <div class="divider"></div>
        <span style="font-size:11px;font-weight:700;color:#64748b;">الفئة:</span>
        <div class="btn-group" id="classFilters">
            <button class="btn active" data-filter="all">الكل</button>
            <button class="btn" data-filter="VIP">VIP</button>
            <button class="btn" data-filter="A">A</button>
            <button class="btn" data-filter="B">B</button>
            <button class="btn" data-filter="B+">B+</button>
            <button class="btn" data-filter="C">C</button>
            <button class="btn" data-filter="C1">C1</button>
            <button class="btn" data-filter="C-R">C-R</button>
        </div>
        <div class="divider"></div>
        <span style="font-size:11px;font-weight:700;color:#64748b;">المدينة:</span>
        <div class="btn-group" id="cityFilters">
            <button class="btn active" data-city="all">الكل</button>
            <button class="btn" data-city="الخبر">الخبر</button>
            <button class="btn" data-city="الدمام">الدمام</button>
            <button class="btn" data-city="الرياض">الرياض</button>
        </div>
    </div>

    <!-- Grid -->
    <div class="grid" id="cardsGrid"></div>
</div>

<script>

        { class: "VIP", city: "الدمام", name: "مستشفى مغربي للعيون والأسنان - الدمام" },
        { class: "VIP", city: "الرياض", name: "مستشفى الملك فيصل التخصصي ومركز الأبحاث - الرياض" },
        { class: "VIP", city: "الرياض", name: "مستشفى الدكتور سليمان الحبيب - التخصصي - الرياض" },
        { class: "VIP", city: "الرياض", name: "مستشفى الدكتور سليمان الحبيب - الريان - الرياض" },
        { class: "VIP", city: "الرياض", name: "مستشفى المملكة - الرياض" },
        { class: "VIP", city: "الرياض", name: "مستشفى المركز التخصصي الطبي - العليا - الرياض" },
        { class: "VIP", city: "الرياض", name: "مدينة الأمير سلطان الطبية العسكرية - الرياض" },
        { class: "A", city: "الخبر", name: "مستشفى المانع - الخبر" },
        { class: "A", city: "الخبر", name: "مستشفى المواساة - الخبر" },
        { class: "A", city: "الخبر", name: "مستشفى اليوسف - الخبر" },
        { class: "A", city: "الخبر", name: "مستشفى جاما - الخبر" },
        { class: "A", city: "الخبر", name: "مستشفى محمد الدوسري - الخبر" },
        { class: "A", city: "الخبر", name: "مستشفى الرعاية التخصصية (بروكير) - الخبر" },
        { class: "A", city: "الدمام", name: "مستشفى السعودي الألماني - الدمام" },
        { class: "A", city: "الدمام", name: "مستشفى المانع - الدمام" },
        { class: "A", city: "الدمام", name: "مستشفى المواساة - الدمام" },
        { class: "A", city: "الدمام", name: "مستشفى الولادة والأطفال - الدمام" },
        { class: "A", city: "الدمام", name: "مستشفى تداوي العام - الدمام" },
        { class: "A", city: "الدمام", name: "مستشفى مغربي للعيون والأسنان - الدمام" },
        { class: "A", city: "الرياض", name: "مستشفى السعودي الالماني - الرياض" },
        { class: "A", city: "الرياض", name: "مستشفى الحمادي - السويدي - الرياض" },
        { class: "A", city: "الرياض", name: "مستشفى دلة - الرياض" },
        { class: "A", city: "الرياض", name: "مستشفى المواساة - الرياض" },
        { class: "A", city: "الرياض", name: "مستشفى رعاية الرياض - الرياض" },
        { class: "A", city: "الرياض", name: "مستشفى المملكة - الرياض" },
        { class: "B", city: "الخبر", name: "مستشفى الرعاية التخصصية (بروكير) - الخبر" },
        { class: "B", city: "الخبر", name: "مستشفى اليوسف - الخبر" },
        { class: "B", city: "الخبر", name: "مستشفى جاما - الخبر" },
        { class: "B", city: "الخبر", name: "مستشفى محمد الدوسري - الخبر" },
        { class: "B", city: "الدمام", name: "مستشفى الولادة والأطفال - الدمام" },
        { class: "B", city: "الدمام", name: "مستشفى تداوي العام - الدمام" },
        { class: "B", city: "الدمام", name: "مستشفى مغربي للعيون والأسنان - الدمام" },
        { class: "B", city: "الرياض", name: "مستشفى الحياة الوطني - الرياض" },
        { class: "B", city: "الرياض", name: "مستشفى دار الشفا - الرياض" },

        { class: "B+", city: "الخبر", name: "مستشفى المانع - الخبر" },

        { class: "B+", city: "الرياض", name: "مستشفى دلة - الرياض" },
        { class: "C", city: "الخبر", name: "مستشفى الرعاية التخصصية (بروكير) - الخبر" },
        { class: "C", city: "الخبر", name: "مستشفى اليوسف - الخبر" },
        { class: "C", city: "الدمام", name: "مستشفى الولادة والأطفال - الدمام" },
        { class: "C", city: "الدمام", name: "مستشفى تداوي العام - الدمام" },
        { class: "C", city: "الرياض", name: "مستشفى الآزهار الطبي - الرياض" },
        { class: "C", city: "الرياض", name: "مستشفى رابية الطبي - الرياض" },
        { class: "C1", city: "الخبر", name: "مستشفى اليوسف - الخبر" },
        { class: "C1", city: "الدمام", name: "مستشفى تداوي العام - الدمام" },
        { class: "C1", city: "الرياض", name: "مستشفى أستر سند للرعاية الطبية - الرياض" },
        { class: "C1", city: "الرياض", name: "مستشفى صحة السلام الطبي - الرياض" },
        { class: "C-R", city: "الدمام", name: "مستشفى الولادة والأطفال - الدمام" },
        { class: "C-R", city: "الرياض", name: "مستشفى عناية العائلة - الرياض" },
        { class: "C-R", city: "الرياض", name: "مستشفى مغربي للعيون والأسنان - الرياض" }
    ];

    function getCardClass(c) {
        const map = { 'VIP': 'card-vip', 'A': 'card-a', 'B': 'card-b', 'B+': 'card-bplus', 'C': 'card-c', 'C1': 'card-c1', 'C-R': 'card-cr' };
        return map[c] || '';
    }
    function getBadgeClass(c) {
        const map = { 'VIP': 'bd-vip', 'A': 'bd-a', 'B': 'bd-b', 'B+': 'bd-bplus', 'C': 'bd-c', 'C1': 'bd-c1', 'C-R': 'bd-cr' };
        return map[c] || '';
    }

    function createCard(h) {
        const div = document.createElement('div');
        div.className = `card ${getCardClass(h.class)}`;
        div.setAttribute('data-class', h.class);
        div.setAttribute('data-city', h.city);
        const encoded = encodeURIComponent(`${h.name} ${h.city}`);
        div.innerHTML = `
            <div class="card-body">
                <div class="card-header">
                    <h3 class="card-title">${h.name}</h3>
                    <span class="class-badge ${getBadgeClass(h.class)}">${h.class}</span>
                </div>
                <div class="card-city"><i class="fas fa-map-marker-alt"></i> ${h.city}</div>
            </div>
            <div class="card-footer">
                <a href="https://www.google.com/maps/search/${encoded}" target="_blank" class="map-btn">
                    <i class="fas fa-map-marked-alt"></i> فتح في قوقل ماب
                </a>
            </div>
        `;
        return div;
    }

    function render() {
        const grid = document.getElementById('cardsGrid');
        grid.innerHTML = '';
        const q = document.getElementById('searchInput').value.toLowerCase();
        const cf = document.querySelector('#classFilters .btn.active')?.getAttribute('data-filter') || 'all';
        const ctf = document.querySelector('#cityFilters .btn.active')?.getAttribute('data-city') || 'all';

        let f = hospitals.filter(h => {
            if (cf !== 'all' && h.class !== cf) return false;
            if (ctf !== 'all' && h.city !== ctf) return false;
            if (q && !`${h.name} ${h.city}`.toLowerCase().includes(q)) return false;
            return true;
        });

        document.getElementById('totalCount').textContent = f.length;
        document.getElementById('vipCount').textContent = f.filter(h => h.class === 'VIP').length;
        document.getElementById('aCount').textContent = f.filter(h => h.class === 'A').length;
        document.getElementById('bCount').textContent = f.filter(h => h.class === 'B').length;
        document.getElementById('bplusCount').textContent = f.filter(h => h.class === 'B+').length;
        document.getElementById('cCount').textContent = f.filter(h => h.class === 'C').length;
        document.getElementById('c1Count').textContent = f.filter(h => h.class === 'C1').length;
        document.getElementById('crCount').textContent = f.filter(h => h.class === 'C-R').length;

        if (f.length === 0) {
            grid.innerHTML = `<div class="no-res">🔍 لا توجد نتائج مطابقة</div>`;
        } else {
            f.forEach(h => grid.appendChild(createCard(h)));
        }
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('classFilters').addEventListener('click', e => {
        if (e.target.classList.contains('btn')) {
            document.querySelectorAll('#classFilters .btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            render();
        }
    });
    document.getElementById('cityFilters').addEventListener('click', e => {
        if (e.target.classList.contains('btn')) {
            document.querySelectorAll('#cityFilters .btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            render();
        }
    });

    render();
</script>
</body>
</html>
