<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل مستشفيات التعاونية للتأمين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --vip-color: #7c3aed;
            --class-a-color: #ea580c;
            --class-b-color: #2563eb;
            --class-c-color: #64748b;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-main);
        }

        .container { max-width: 1300px; margin: 0 auto; }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
        }

        .header .logo {
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: 800;
            color: #1e3a8a;
            margin: 0 auto 15px;
        }

        .header h1 { font-size: 2em; font-weight: 800; margin-bottom: 5px; }
        .header p { opacity: 0.95; font-size: 1.1em; }

        /* Legend */
        .legend {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .legend-dot {
            width: 18px;
            height: 18px;
            border-radius: 5px;
        }

        .legend-vip { background: var(--vip-color); }
        .legend-a { background: var(--class-a-color); }
        .legend-b { background: var(--class-b-color); }
        .legend-c { background: var(--class-c-color); }

        /* Search */
        .search-container {
            margin-bottom: 20px;
        }

        .search-box {
            width: 100%;
            padding: 15px 25px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            border: 2px solid #e2e8f0;
            border-radius: 50px;
            outline: none;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* Filter Buttons */
        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            justify-content: center;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .filter-btn:hover { border-color: #2563eb; color: #2563eb; }
        .filter-btn.active { background: #2563eb; color: white; border-color: #2563eb; }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 15px;
        }

        .hospital-card {
            background: white;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-right: 5px solid #e2e8f0;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hospital-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .card-vip { border-right-color: var(--vip-color); background: #faf5ff; }
        .card-a { border-right-color: var(--class-a-color); background: #fff7ed; }
        .card-b { border-right-color: var(--class-b-color); background: #eff6ff; }
        .card-c { border-right-color: var(--class-c-color); background: #f8fafc; }

        .hospital-name {
            font-size: 1.1em;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .hospital-info {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            font-size: 0.85em;
            color: var(--text-muted);
        }

        .class-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.8em;
            color: white;
        }

        .badge-vip { background: var(--vip-color); }
        .badge-a { background: var(--class-a-color); }
        .badge-b { background: var(--class-b-color); }
        .badge-c { background: var(--class-c-color); }

        .city-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.8em;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #f1f5f9;
            font-size: 0.8em;
            color: var(--text-muted);
        }

        .no-results {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
            font-size: 1.2em;
            grid-column: 1 / -1;
            background: white;
            border-radius: 15px;
        }

        /* Stats */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 4px solid #e2e8f0;
        }

        .stat-number { font-size: 1.8em; font-weight: 800; display: block; }
        .stat-label { color: var(--text-muted); font-size: 0.8em; }
        .stat-vip { border-top-color: var(--vip-color); } .stat-vip .stat-number { color: var(--vip-color); }
        .stat-a { border-top-color: var(--class-a-color); } .stat-a .stat-number { color: var(--class-a-color); }
        .stat-b { border-top-color: var(--class-b-color); } .stat-b .stat-number { color: var(--class-b-color); }
        .stat-c { border-top-color: var(--class-c-color); } .stat-c .stat-number { color: var(--class-c-color); }

        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.5em; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="logo">ت</div>
        <h1>🏥 دليل مستشفيات التعاونية للتأمين</h1>
        <p>Tawuniya Insurance - Medical Network Guide</p>
    </div>

    <!-- Legend -->
    <div class="legend">
        <div class="legend-item"><div class="legend-dot legend-vip"></div> VIP</div>
        <div class="legend-item"><div class="legend-dot legend-a"></div> A</div>
        <div class="legend-item"><div class="legend-dot legend-b"></div> B</div>
        <div class="legend-item"><div class="legend-dot legend-c"></div> C</div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
        <div class="stat-card stat-vip"><span class="stat-number" id="vipCount">0</span><span class="stat-label">VIP</span></div>
        <div class="stat-card stat-a"><span class="stat-number" id="aCount">0</span><span class="stat-label">A</span></div>
        <div class="stat-card stat-b"><span class="stat-number" id="bCount">0</span><span class="stat-label">B</span></div>
        <div class="stat-card stat-c"><span class="stat-number" id="cCount">0</span><span class="stat-label">C</span></div>
    </div>

    <!-- Search -->
    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن مستشفى أو مدينة...">
    </div>

    <!-- Filter Buttons -->
    <div class="filter-buttons" id="filterButtons">
        <button class="filter-btn active" data-filter="all">🏥 الكل</button>
        <button class="filter-btn" data-filter="VIP">🟣 VIP</button>
        <button class="filter-btn" data-filter="A">🟠 A</button>
        <button class="filter-btn" data-filter="B">🔵 B</button>
        <button class="filter-btn" data-filter="C">⚫ C</button>
    </div>

    <!-- Cards Grid -->
    <div class="cards-grid" id="cardsGrid"></div>
</div>

<script>
    // ==================== HOSPITALS DATABASE ====================
    const hospitals = [
        // منطقة الرياض
        { name: "مستشفى الدكتور سليمان الحبيب - العليا", class: "VIP", city: "الرياض" },
        { name: "مستشفى الدكتور سليمان الحبيب - الريان", class: "VIP", city: "الرياض" },
        { name: "مستشفى الدكتور سليمان الحبيب - التخصصي", class: "VIP", city: "الرياض" },
        { name: "مستشفى المملكة", class: "VIP", city: "الرياض" },
        { name: "مستشفى المركز التخصصي الطبي", class: "VIP", city: "الرياض" },
        { name: "مستشفى الحمادي", class: "VIP", city: "الرياض" },
        { name: "مستشفى السعودي الألماني", class: "A", city: "الرياض" },
        { name: "مستشفى المواساة", class: "A", city: "الرياض" },
        { name: "مستشفى دله", class: "A", city: "الرياض" },
        { name: "مستشفى رعاية الوطني", class: "A", city: "الرياض" },
        { name: "مستشفى الحياة الوطني", class: "A", city: "الرياض" },
        { name: "مستشفى عيادة العبير", class: "B", city: "الرياض" },
        { name: "مستشفى الزهراء", class: "B", city: "الرياض" },
        { name: "مستشفى الدكتور عبدالرحمن المشاري", class: "B", city: "الرياض" },
        { name: "مستشفى اليمامة", class: "C", city: "الرياض" },
        
        // المنطقة الشرقية - الخبر
        { name: "مستشفى الدكتور سليمان الحبيب - الخبر", class: "VIP", city: "الخبر" },
        { name: "مستشفى سعد التخصصي", class: "VIP", city: "الخبر" },
        { name: "مستشفى الرعاية - الخبر", class: "A", city: "الخبر" },
        { name: "مستشفى الخبر الوطني", class: "A", city: "الخبر" },
        { name: "مستشفى محمد الدوسري", class: "B", city: "الخبر" },
        { name: "مستشفى الهلال", class: "C", city: "الخبر" },
        
        // المنطقة الشرقية - الدمام
        { name: "مستشفى المواساة - الدمام", class: "A", city: "الدمام" },
        { name: "مستشفى المانع العام", class: "A", city: "الدمام" },
        { name: "مستشفى الأهلي", class: "B", city: "الدمام" },
        { name: "مجمع الدمام الطبي", class: "B", city: "الدمام" },
        { name: "مستشفى الدمام الوطني", class: "B", city: "الدمام" },
        
        // المنطقة الشرقية - الظهران
        { name: "مستشفى الظهران العام", class: "B", city: "الظهران" },
        { name: "مستشفى الظهران الطبي", class: "B", city: "الظهران" },
        
        // المنطقة الشرقية - القطيف
        { name: "مستشفى القطيف المركزي", class: "B", city: "القطيف" },
        { name: "مستشفى القطيف الأهلي", class: "C", city: "القطيف" },
        
        // المنطقة الشرقية - الجبيل
        { name: "مستشفى الهيئة الملكية", class: "A", city: "الجبيل" },
        { name: "مستشفى الجبيل العام", class: "C", city: "الجبيل" },
        { name: "مستشفى المانع - الجبيل", class: "B", city: "الجبيل" },
        
        // المنطقة الشرقية - أخرى
        { name: "مستشفى عنك", class: "C", city: "عنك" },
        { name: "مستشفى عين دار", class: "C", city: "عين دار" },
        { name: "مستشفى بقيق العام", class: "C", city: "بقيق" },
        { name: "مستشفى رأس تنورة", class: "C", city: "رأس تنورة" },
        { name: "مستشفى النعيرية", class: "C", city: "النعيرية" },
        
        // المنطقة الغربية
        { name: "مستشفى الدكتور سليمان الحبيب - جدة", class: "VIP", city: "جدة" },
        { name: "مستشفى السعودي الألماني - جدة", class: "A", city: "جدة" },
        { name: "مستشفى المواساة - جدة", class: "A", city: "جدة" },
        { name: "مستشفى باقدو والدكتور عرفان", class: "B", city: "جدة" }
    ];

    // ==================== FUNCTIONS ====================
    const cardsGrid = document.getElementById('cardsGrid');
    const searchInput = document.getElementById('searchInput');
    const filterButtons = document.getElementById('filterButtons');
    let currentFilter = 'all';

    function getCardClass(hospitalClass) {
        switch(hospitalClass) {
            case 'VIP': return 'card-vip';
            case 'A': return 'card-a';
            case 'B': return 'card-b';
            case 'C': return 'card-c';
            default: return '';
        }
    }

    function getBadgeClass(hospitalClass) {
        switch(hospitalClass) {
            case 'VIP': return 'badge-vip';
            case 'A': return 'badge-a';
            case 'B': return 'badge-b';
            case 'C': return 'badge-c';
            default: return '';
        }
    }

    function createCard(hospital) {
        const card = document.createElement('div');
        card.className = `hospital-card ${getCardClass(hospital.class)}`;
        card.setAttribute('data-class', hospital.class);
        card.setAttribute('data-city', hospital.city);
        
        card.innerHTML = `
            <h3 class="hospital-name">🏥 ${hospital.name}</h3>
            <div class="hospital-info">
                <span class="class-badge ${getBadgeClass(hospital.class)}">${hospital.class}</span>
                <span class="city-tag">📍 ${hospital.city}</span>
            </div>
            <div class="card-footer">
                <span>🟢 متاح</span>
                <span>التعاونية</span>
            </div>
        `;
        
        return card;
    }

    function renderCards() {
        cardsGrid.innerHTML = '';
        
        const searchQuery = searchInput.value.toLowerCase();
        
        let filtered = hospitals.filter(hospital => {
            // Class filter
            if (currentFilter !== 'all' && hospital.class !== currentFilter) return false;
            
            // Search filter
            if (searchQuery) {
                const searchText = `${hospital.name} ${hospital.city} ${hospital.class}`.toLowerCase();
                if (!searchText.includes(searchQuery)) return false;
            }
            
            return true;
        });
        
        // Update stats
        document.getElementById('vipCount').textContent = hospitals.filter(h => h.class === 'VIP').length;
        document.getElementById('aCount').textContent = hospitals.filter(h => h.class === 'A').length;
        document.getElementById('bCount').textContent = hospitals.filter(h => h.class === 'B').length;
        document.getElementById('cCount').textContent = hospitals.filter(h => h.class === 'C').length;
        
        if (filtered.length === 0) {
            cardsGrid.innerHTML = '<div class="no-results">🔍 لا توجد نتائج مطابقة للبحث</div>';
        } else {
            filtered.forEach(hospital => {
                cardsGrid.appendChild(createCard(hospital));
            });
        }
    }

    // ==================== EVENT LISTENERS ====================
    searchInput.addEventListener('input', () => renderCards());

    filterButtons.addEventListener('click', function(e) {
        if (e.target.classList.contains('filter-btn')) {
            this.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            currentFilter = e.target.getAttribute('data-filter');
            renderCards();
        }
    });

    // Initial render
    renderCards();
</script>

</body>
</html>
